<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/assets/logos/logo-square.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SahyogSeva - Cooperative Gig-Services Platform</title>
    <meta name="description" content="SahyogSeva — India's cooperative doorstep services platform. Book background-verified electricians, plumbers, carpenters & domestic helpers. Zero advance payment. 30-minute rapid arrival. Pay cash or UPI after service." />
    
    <!-- PWA & Mobile Web App Meta Tags -->
    <meta name="theme-color" content="#064e3b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SahyogSeva" />
    <link rel="apple-touch-icon" href="/assets/logos/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased font-sans min-h-screen">
    <script>
      window.deferredPWAInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.deferredPWAInstallPrompt = e;
        window.dispatchEvent(new Event('pwa-prompt-captured'));
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
